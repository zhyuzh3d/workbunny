<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workbunny-灯光工作台</title><link rel="icon" type="image/svg+xml" href="/brand.svg"><link rel="stylesheet" href="/form-controls.css"><link rel="stylesheet" href="/lab.css">
<script type="importmap" nonce="__NONCE__">{"imports":{"three":"/vendor/three.module.js","three/addons/":"/vendor/jsm/","@pixiv/three-vrm":"/vendor/three-vrm.module.js","@pixiv/three-vrm-animation":"/vendor/three-vrm-animation.module.js"}}</script></head><body>
<header class="topbar"><div class="brand"><img class="brand-mark" src="/brand.svg" alt=""><div><h1>Bunny 灯光工作台</h1><p>调出你喜欢的样子</p></div></div><div class="top-actions"><button id="importSettings" class="quiet">导入参数</button><button id="download">导出 JSON</button><button id="save" class="primary">保存全部参数</button></div></header>
<main><section class="studio"><div class="model-toolbar"><label for="model">角色</label><select id="model" aria-label="预览角色"></select><button id="importModel">导入 VRM</button><span class="toolbar-note">各角色分别记录</span></div>
<div id="viewport"><div class="view-buttons" role="group" aria-label="取景"><button data-view="bust" class="active">半身</button><button data-view="full">全身</button><button data-view="face">脸部</button><button data-view="lights">灯位全景</button></div><div class="viewport-state"><span id="modelTitle">正在准备模型</span><span id="previewBadge">实时预览</span></div><div id="loading" class="loading">正在准备模型…</div><div class="stage-bottom"><span>拖动旋转 · 滚轮缩放 · 右键平移</span><button id="compare">按住对比原版</button></div></div>
<div class="preview-toolbar"><label>背景<input id="background" type="color" value="#e3e6e3" aria-label="预览背景颜色"></label><button data-bg="#f6f4ef" class="swatch light" title="浅色背景" aria-label="浅色背景"></button><button data-bg="#e3e6e3" class="swatch gray" title="灰色背景" aria-label="灰色背景"></button><button data-bg="#242a2b" class="swatch dark" title="深色背景" aria-label="深色背景"></button><label class="switch-label">灯位<input id="helpers" type="checkbox" role="switch"></label><label class="switch-label">地面<input id="floor" type="checkbox" role="switch" checked></label><label class="switch-label">动作<input id="animated" type="checkbox" role="switch"></label><span id="renderNote"></span></div>
<div class="save-strip"><span id="status" role="status" aria-live="polite">载入后即可调整</span><span id="savedAt"></span></div></section>
<aside><div class="aside-top"><h2>照明</h2><button id="reset" class="text-button">还原此角色</button></div><div class="preset-row"><button data-preset="current">当前 Bunny</button><button data-preset="soft">柔和自然</button><button data-preset="studio">柔光棚拍</button><button data-preset="off">检查自发光</button></div><fieldset id="controls" disabled></fieldset><p class="aside-foot">调好后点击“保存全部参数”，即可将同一组参数用于 Bunny。</p></aside></main>
<input id="vrmFile" type="file" accept=".vrm" hidden><input id="settingsFile" type="file" accept=".json,application/json" hidden><script type="module" src="/lab.js"></script></body></html>
