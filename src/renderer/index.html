<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>workbaby</title>
<link rel="stylesheet" href="./style.css" />
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/jsm/",
    "@pixiv/three-vrm": "./vendor/three-vrm.module.js",
    "@pixiv/three-vrm-animation": "./vendor/three-vrm-animation.module.js"
  }
}
</script>
</head>
<body>
<div id="stage"></div>
<div id="ground"></div>

<!-- 对话气泡 -->
<div id="bubble" class="hidden" aria-live="polite">
  <div id="bubbleText"></div>
  <div id="bubbleTail"></div>
</div>

<!-- 换角色时的等待态：角色区域转圈，其他 UI 照常显示（绝不整片空白） -->
<div id="loading" class="hidden">
  <div class="spin"></div>
  <div id="loadingTxt">正在努力加载…</div>
</div>

<!-- 顶栏一条线：左边状态、右边按钮，三者竖向居中对齐（都在 top:11px、高 26px） -->
<div id="activity" class="hidden">
  <span class="dot"></span>
  <span class="actRoll"><span id="activityText">在干活</span></span>
  <button id="actDone" title="这条我看过了" aria-label="这条我看过了">
    <svg viewBox="0 0 12 12" width="10" height="10" fill="none" stroke="currentColor"
         stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2.2 6.4l2.4 2.4 5.2-5.4"/></svg>
  </button>
</div>

<div id="fab" class="hidden">
  <button id="motionBtn" title="动作列表">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor"
         stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 6.5h7"/><path d="M4 12h7"/><path d="M4 17.5h7"/>
      <path d="M16 8.4l4 3.6-4 3.6z" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <button id="muteBtn" title="静音">
    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
      <path d="M4 9.5h3l4-3.2v11.4l-4-3.2H4z"/><path id="muteWave" d="M15.4 9a4 4 0 0 1 0 6"/>
    </svg>
  </button>
  <button id="gearBtn" title="设置">
    <!-- 真齿轮：外齿 + 中心孔，一眼认得出是设置 -->
    <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
         stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round">
      <path d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"/>
      <path d="M19.1 14.6a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.1a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.1a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.1a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.1a1.65 1.65 0 0 0-1.51 1Z"/>
    </svg>
  </button>
</div>

<!-- 录制律动 -->
<div id="rec" class="hidden">
  <div class="ring"><i></i><i></i><i></i></div>
  <div id="recText">在听…</div>
</div>

<!-- 脚下这条：耳朵状态（绿=在听 / 灰=关着）+ 实时电平 + 刚听到的话。
     左端钉在角色脚下左侧、地面线下方；一旦有话说，就撑到整窗宽，
     长了不省略，而是横向滚动 —— 主人能完整看见自己说的每个字。 -->
<div id="ear" class="off" title="点一下打字 · 长按开关耳朵">
  <span class="earDot"></span>
  <span class="bars"><i></i><i></i><i></i><i></i></span>
  <span class="earWin"><span id="earTxt">耳朵关着</span></span>
</div>

<!-- 输入框：只在打字时出现（听的状态已经交给脚下那条了，不再重复） -->
<div id="dock" class="hidden">
  <input id="input" type="text" placeholder="跟我说点什么…" autocomplete="off" spellcheck="false" />
  <button id="sendBtn" class="iconBtn primary" title="发送">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h13"/><path d="M12.5 6l6 6-6 6"/>
    </svg>
  </button>
</div>

<!-- 首次提示 -->
<div id="hint" class="hidden">点我说话 · ⌘⇧Space 开关我的耳朵</div>

<!-- ═══ 动作列表（顶部菜单「动作列表…」或右上 ▶ 打开） ═══
     点一下就在原地演一遍，角色始终在画面里（面板只占右侧一条） -->
<div id="motions" class="panel hidden">
  <div class="ph"><b>动作</b><button id="closeMotions" title="关闭">✕</button></div>
  <div class="pb" id="motionList"></div>
</div>

<!-- 设置面板 -->
<div id="settings" class="panel hidden">
  <div class="ph">
    <b>workbaby · baby 的设置</b>
    <button id="closeSettings" title="关闭">✕</button>
  </div>
  <div class="sb">
    <label class="row"><span>名字</span><input id="setName" type="text" /></label>

    <div class="group">形象</div>
    <div class="avRow" id="avRow"></div>

    <div class="group">大小</div>
    <div class="segRow" id="sizeRow">
      <button data-k="0.5">50%</button>
      <button data-k="1">100%</button>
      <button data-k="1.5">150%</button>
    </div>

    <div class="group">动作</div>
    <div class="permBtns" style="margin-top:0">
      <button id="openMotions" class="mini">打开动作列表</button>
    </div>

    <div class="group">听见你</div>
    <div class="permBox">
      <div class="permLine"><span>语音识别</span><b id="permSpeech" class="pill">—</b></div>
      <div class="permLine"><span>麦克风</span><b id="permMic" class="pill">—</b></div>
      <div class="permBtns">
        <button id="permCheck" class="mini">检查权限</button>
        <button id="permOpenSpeech" class="mini">开语音识别</button>
        <button id="permOpenMic" class="mini">开麦克风</button>
      </div>
      <div id="permTip" class="permTip"></div>
    </div>

    <div class="group">模型</div>
    <label class="row"><span>接口</span><input id="setUrl" type="text" placeholder="https://…/v1" /></label>
    <label class="row"><span>模型</span><input id="setModel" type="text" /></label>
    <label class="row"><span>Key</span><input id="setKey" type="password" placeholder="留空则用 WorkBuddy 的" /></label>

    <div class="group">声音</div>
    <label class="row"><span>说话</span><input id="setTtsOn" type="checkbox" /></label>
    <label class="row"><span>TTS 地址</span><input id="setTtsUrl" type="text" /></label>
    <label class="row"><span>TTS Key</span><input id="setTtsKey" type="password" /></label>
    <label class="row"><span>音色描述</span><textarea id="setTtsInstr" rows="2"></textarea></label>

    <div class="group">盯 WorkBuddy</div>
    <label class="row"><span>任务做完就播报</span><input id="setOnDone" type="checkbox" /></label>
    <label class="row"><span>拖太久时提醒</span><input id="setOnLong" type="checkbox" /></label>
    <label class="row"><span>卡住时提醒</span><input id="setOnStall" type="checkbox" /></label>
    <label class="row"><span>连着干太久劝歇</span><input id="setOnRest" type="checkbox" /></label>
    <label class="row"><span>最短间隔(秒)</span><input id="setGap" type="number" min="10" step="5" /></label>
  </div>

  <div class="sf">
    <pre id="probeOut" class="hidden"></pre>
    <div class="actions">
      <button id="probeBtn" class="wide">连通性自检</button>
      <button id="saveBtn" class="wide primary">保存</button>
    </div>
  </div>
</div>

<script type="module" src="./app.js"></script>
</body>
</html>
