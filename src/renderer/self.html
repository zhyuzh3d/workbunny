<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'">
<title>Workbunny-自我理解</title><link rel="stylesheet" href="./companion.css"><link rel="stylesheet" href="./form-controls.css">
<link rel="icon" type="image/svg+xml" href="../../res/logo.svg">
<link rel="stylesheet" href="./brand.css">
<script type="module" src="./brand-window.mjs"></script>
</head><body>
  <main id="selfDialog" class="self-dialog self-window" aria-labelledby="selfDialogTitle">
    <header class="self-dialog-head"><div><h2 id="selfDialogTitle" data-character-text="Bunny 的自我理解">她 的自我理解</h2><p class="inline-note">点击条目右侧的编辑按钮修改。</p></div><button id="selfClose" class="button quiet" aria-label="关闭自我理解">关闭</button></header>
    <div class="self-dialog-toolbar"><button id="selfGlobalLock" class="button">锁定自我理解</button><button id="selfRefresh" class="button quiet">刷新</button><button id="selfAdd" class="button primary">添加理解</button></div>
    <div id="selfLockNote" class="inline-note self-lock-note"></div>
    <div id="selfEntries" class="self-entries"></div>
    <footer class="self-dialog-foot"><div id="selfStatus" class="inline-note" role="status" aria-live="polite"></div></footer>
  </main>
  <dialog id="selfEntryDialog" class="self-entry-dialog" aria-labelledby="selfEntryTitle">
    <header class="self-dialog-head"><h2 id="selfEntryTitle">编辑理解</h2><button id="selfEntryClose" class="button quiet" aria-label="关闭条目编辑">关闭</button></header>
    <div class="self-entry-body">
      <label class="self-field" for="selfEntryFacet">分类<select id="selfEntryFacet" aria-label="理解的分类"></select></label>
      <label class="self-field" for="selfEntryText">内容<textarea id="selfEntryText" rows="3" maxlength="400" aria-label="自我理解正文"></textarea></label>
      <label class="self-field" for="selfEntryCondition">条件 <span class="inline-note">选填</span><input id="selfEntryCondition" type="text" maxlength="160" placeholder="例如：主人倾诉时" aria-label="适用条件"></label>
      <details id="selfEntryHistory" class="self-revisions"><summary>修订记录</summary><div id="selfEntryHistoryList" class="self-history"></div></details>
      <div id="selfEntryStatus" class="inline-note" role="status" aria-live="polite"></div>
    </div>
    <footer class="self-entry-actions"><button id="selfEntryDelete" class="button danger">删除</button><span></span><button id="selfEntryCancel" class="button quiet">取消</button><button id="selfEntrySave" class="button primary">保存</button></footer>
  </dialog>
<script type="module" src="./self-window.js"></script></body></html>
